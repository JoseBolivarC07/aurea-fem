<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Emblema de Áurea Fem">
  <title>Áurea Fem</title>

  <!-- Disco de marca en el rojo principal 910D2B -->
  <circle cx="60" cy="60" r="60" fill="#910D2B"/>

  <!-- Filigrana central: brote y volutas simétricas -->
  <g fill="none" stroke="#F7ECEC" stroke-width="2.1" stroke-linecap="round">
    <ellipse cx="60" cy="37" rx="4.6" ry="7.4"/>

    <!-- Voluta izquierda -->
    <path d="M60 78C57.5 62 47.5 49 35.5 47.5c-8.4-1-12.8 6.4-7.6 11.2 2.9 2.7 7.2 1.3 7.4-2.3"/>
    <!-- Voluta derecha (reflejo exacto de la anterior) -->
    <path d="M60 78c2.5-16 12.5-29 24.5-30.5 8.4-1 12.8 6.4 7.6 11.2-2.9 2.7-7.2 1.3-7.4-2.3"/>

    <!-- Arcos interiores que enmarcan el brote -->
    <path d="M60 76c-1.6-11.5 3-21.8 12.4-27.6"/>
    <path d="M60 76c1.6-11.5-3-21.8-12.4-27.6"/>
  </g>

  <!-- Rocío: puntos que descienden hacia el centro -->
  <g fill="#F7ECEC">
    <circle cx="42.5" cy="83" r="1.7"/>
    <circle cx="48.6" cy="87.4" r="1.7"/>
    <circle cx="54.4" cy="90.4" r="1.7"/>
    <circle cx="77.5" cy="83" r="1.7"/>
    <circle cx="71.4" cy="87.4" r="1.7"/>
    <circle cx="65.6" cy="90.4" r="1.7"/>
    <circle cx="60" cy="94.2" r="2.5"/>
  </g>
</svg>
